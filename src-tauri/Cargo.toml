[package]
name = "transcript-processor-rust"
version = "1.0.0"
description = "YouTube Transcript Processor - Lightweight Rust Edition"
authors = ["julienrollin"]
edition = "2021"

[lib]
name = "transcript_processor_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
scraper = "0.21"
urlencoding = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
